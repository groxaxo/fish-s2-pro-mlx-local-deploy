name: fish-speech-mlx

services:
  mlx-proxy:
    build:
      context: .
      dockerfile: local_mlx/Dockerfile.proxy
    environment:
      FISH_MLX_UPSTREAM: ${FISH_MLX_UPSTREAM:-http://host.docker.internal:8881}
      PORT: 8880
    ports:
      - "${API_PORT:-8880}:8880"
    restart: unless-stopped
